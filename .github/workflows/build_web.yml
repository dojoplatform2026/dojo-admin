name: DOJO WALK Admin Web Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_DOJO_ADMIN_LIVE to authorize a live Hosting deployment"
        required: true
        type: string
      target_project:
        description: "Must match the intended Firebase project ID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dojo-admin-live-hosting-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_DOJO_ADMIN_LIVE' && inputs.target_project == 'dojo-platform-b68a3' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOJO_PLATFORM_B68A3 }}'
          projectId: dojo-platform-b68a3
          channelId: live
