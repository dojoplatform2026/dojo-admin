name: Admin Web Build Check (No Deploy)

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'web/**'
      - '.github/workflows/admin-web-build-check.yml'
  push:
    branches:
      - step-119-boundary-geometry
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'web/**'
      - '.github/workflows/admin-web-build-check.yml'

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze complete Admin project
        run: flutter analyze

      - name: Run complete Admin test suite
        run: flutter test

      - name: Build Flutter Web (no deployment)
        run: flutter build web --release
