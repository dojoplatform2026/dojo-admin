name: dojo_admin
description: DOJO WALK Admin Portal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3

  # Maps and Networking
  google_maps_flutter: ^2.13.1
  http: ^1.5.0

  # Utilities
  intl: ^0.20.2
  go_router: ^16.2.4
  crypto: ^3.0.6

  # KYC PDF Viewer
  pdfrx: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # In-memory Firestore fake for service-layer tests without native plugin channels.
  fake_cloud_firestore: ^4.0.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
